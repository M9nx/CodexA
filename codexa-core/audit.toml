[advisories]
ignore = [
    "RUSTSEC-2026-0177", # pyo3: Missing `Sync` bound on `PyCFunction::new_closure` (Not using new_closure in our codebase)
    "RUSTSEC-2025-0020", # pyo3: Risk of buffer overflow in `PyString::from_object` (Not constructing strings this way directly)
    "RUSTSEC-2024-0384", # instant: Unmaintained crate (Transitive dependency from tree-sitter or similar, no immediate risk)
    "RUSTSEC-2026-0190", # anyhow: Unsoundness in `Error::downcast_mut()` (We do not use downcast_mut for Error objects)
    "RUSTSEC-2026-0002", # lru: `IterMut` violates Stacked Borrows (We do not iterate mutably over LRU caches)
    "RUSTSEC-2026-0186", # memmap2: Unchecked pointer offset in crate `memmap2` (We only use standard mmap functionality for indexing, no unsafe offsets)
    "RUSTSEC-2026-0097", # rand: Rand is unsound with a custom logger using `rand::rng()` (We do not use custom loggers inside rand generation)
]
